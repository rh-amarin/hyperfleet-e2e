# HyperFleet E2E Test Configuration
#
# This is the main configuration file for the E2E test framework.
# It is automatically loaded from ./configs/config.yaml if present.
#
# Configuration Priority (highest to lowest):
#   1. Command-line flags
#   2. Environment variables (HYPERFLEET_* prefix)
#   3. This config file
#   4. Built-in defaults
#
# See docs/config.md for full documentation

# ============================================================================
# API Configuration
# ============================================================================

api:
  # HyperFleet API URL
  # Can be overridden by:
  #   - CLI flag: --api-url
  #   - Environment variable: HYPERFLEET_API_URL
  #
  # This is REQUIRED for running tests
  url: ""

# ============================================================================
# Timeout Configuration
# ============================================================================

timeouts:
  cluster:
    # Maximum time to wait for cluster Reconciled condition
    #
    # Format: Duration string (e.g., "30m", "1h", "5m")
    # Can be overridden by: HYPERFLEET_TIMEOUTS_CLUSTER_RECONCILED
    reconciled: 2m

    # Maximum time to wait for cluster hard-delete (404 response)
    # Can be overridden by: HYPERFLEET_TIMEOUTS_CLUSTER_DELETED
    deleted: 2m

  nodepool:
    # Maximum time to wait for nodepool Reconciled condition
    #
    # Format: Duration string
    # Can be overridden by: HYPERFLEET_TIMEOUTS_NODEPOOL_RECONCILED
    reconciled: 2m

    # Maximum time to wait for nodepool hard-delete (404 response)
    # Can be overridden by: HYPERFLEET_TIMEOUTS_NODEPOOL_DELETED
    deleted: 2m

  adapter:
    # Maximum time to wait for adapter processing
    #
    # Format: Duration string
    # Can be overridden by: HYPERFLEET_TIMEOUTS_ADAPTER_PROCESSING
    processing: 2m

# ============================================================================
# Polling Configuration
# ============================================================================

polling:
  # Polling interval for status checks
  # How often to check cluster/adapter status during wait operations
  #
  # Lower values = faster feedback, higher API load
  # Higher values = slower feedback, lower API load
  #
  # Format: Duration string
  # Recommended: 10s for production, 5s for development (faster feedback)
  # Can be overridden by: HYPERFLEET_POLLING_INTERVAL
  interval: 10s

# ============================================================================
# Logging Configuration
# ============================================================================

log:
  # Log level: debug, info, warn, error
  # Can be overridden by: HYPERFLEET_LOG_LEVEL
  level: info

  # Log format: text, json
  # Can be overridden by: HYPERFLEET_LOG_FORMAT
  format: text

  # Log output: stdout, stderr
  # Can be overridden by: HYPERFLEET_LOG_OUTPUT
  output: stdout

# ============================================================================
# Adapter Configuration
# ============================================================================

adapters:
  # Required adapters for cluster resources
  # Map of adapter name to service URL
  #
  # Can be overridden by (comma-separated name=url pairs):
  #   - HYPERFLEET_ADAPTERS_CLUSTER
  #   - API_ADAPTERS_CLUSTER
  cluster:
    cl-namespace: "http://cl-namespace.hyperfleet.svc.cluster.local:8082"
    cl-job: "http://cl-job.hyperfleet.svc.cluster.local:8082"
    cl-deployment: "http://cl-deployment.hyperfleet.svc.cluster.local:8082"
    cl-maestro: "http://cl-maestro.hyperfleet.svc.cluster.local:8082"

  # Required adapters for nodepool resources
  # Map of adapter name to service URL
  #
  # Can be overridden by (comma-separated name=url pairs):
  #   - HYPERFLEET_ADAPTERS_NODEPOOL
  #   - API_ADAPTERS_NODEPOOL
  nodepool:
    np-configmap: "http://np-configmap.hyperfleet.svc.cluster.local:8082"

# ============================================================================
# JWT Authentication Configuration
# ============================================================================

identity:
  # Expected audit identity for test assertions.
  # For K8s SA tokens with identity_claim=sub, format is "system:serviceaccount:<ns>:<sa>".
  # The API resolves caller identity from the JWT claim — this field tells
  # the E2E framework what value to expect in created_by / deleted_by fields.
  # Can be overridden by: HYPERFLEET_IDENTITY_EXPECTEDIDENTITY
  expectedIdentity: ""

  # Token Request Configuration (K8s TokenRequest API)
  # When enabled (serviceAccountName is set), the E2E framework acquires
  # a JWT from the K8s cluster at startup using the TokenRequest API.
  # This is the recommended auth method for JWT-enabled API deployments.
  #
  # Required: serviceAccountName and namespace
  # The SA must exist in the target namespace before tests run.
  #
  # Can be overridden by environment variables:
  #   HYPERFLEET_IDENTITY_TOKENREQUEST_SERVICEACCOUNTNAME
  #   HYPERFLEET_IDENTITY_TOKENREQUEST_NAMESPACE
  #   HYPERFLEET_IDENTITY_TOKENREQUEST_AUDIENCE
  #   HYPERFLEET_IDENTITY_TOKENREQUEST_EXPIRATIONSECONDS
  tokenRequest:
    serviceAccountName: ""
    namespace: ""
    audience: "hyperfleet-api"
    expirationSeconds: 7200
