adapterConfig:
  create: true
  files:
    adapter-config.yaml: cl-m-wrong-nest/adapter-config.yaml
  log:
    level: debug

adapterTaskConfig:
  create: true
  files:
    task-config.yaml: cl-m-wrong-nest/adapter-task-config.yaml


image:
  registry: ${IMAGE_REGISTRY}
  repository: ${ADAPTER_IMAGE_REPO}
  pullPolicy: Always
  tag: ${ADAPTER_IMAGE_TAG}
rbac:
   resources:
     - namespaces
     - configmaps
     - configmaps/status

labels:
  e2e.hyperfleet.io/run-id: ${RUN_ID}

env:
  - name: RUN_ID
    value: ${RUN_ID}
